
<main>
    <div class="login-container">
        <div>
            <p class="title">Welcome back!</p>
            <p class="subtitle">Enter your credentials to access your account</p>
        </div>
        <form action="">
            <div class="inputs">
                <p>Email</p>
                <input type="text" placeholder="Enter your email" class="input-field"/>
            </div>
            <div class="inputs">
                <p>Password</p>
                <input type="password" placeholder="Enter your password" class="input-field"/>
            </div>
            <div class="login-details">
                <div class="checkbox-container">
                    <input type="checkbox" class="checkbox"/>
                    <p>Remember me for 30 days</p>
                </div>
                <a [routerLink]="['/']">forgotten password</a>
            </div>
            <button>Login</button>
        </form>
        <div class="divider">
            <div class="line"></div>
            <p class="or">or</p>
            <div class="line"></div>
        </div>
        <div class="social-login">
            <img src="/images/icons8-google 1.svg" alt="">
            <p>Signin with Google</p>
        </div>
        <div class="signup-link">
            <p class="signup">Don’t have an account? <a [routerLink]="['/signup']">Sign up</a></p>
        </div>
    </div>
    <img src="/images/chris-lee-70l1tDAI6rM-unsplash 1.svg" alt="">
</main>
