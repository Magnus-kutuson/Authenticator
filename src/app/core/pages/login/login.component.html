<main>
    <div class="login-container">
        <div>
            <p class="title">Welcome back!</p>
            <p class="subtitle">Enter your credentials to access your account</p>
        </div>
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <div class="inputs">
                <label for="email">Email</label>
                <input type="text" 
                formControlName="email"
                id="email"
                placeholder="Enter your email" 
                class="input-field"
                [ngClass]="{ 'invalid': loginForm.get('email')?.invalid && loginForm.get('email')?.touched }"
                aria-required="true"
                />
                 <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="error-message">
                      <small *ngIf="loginForm.get('email')?.errors?.['required']">Email is required</small>             
                     <small *ngIf="loginForm.get('email')?.errors?.['minlength']">Email must be at least 6 characters</small>
                </div>
            </div>
            <div class="inputs">
                <label for="password">Password</label>
                <input type="password" 
                formControlName="password"
                id="password" 
                placeholder="Enter your password" 
                [ngClass]="{ 'invalid': loginForm.get('password')?.invalid && loginForm.get('password')?.touched }"
                class="input-field"
                aria-required="true"
                />
               <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="error-message">
                      <small *ngIf="loginForm.get('password')?.errors?.['required']">Password is required</small>             
                     <small *ngIf="loginForm.get('password')?.errors?.['minlength']">Password must be at least 6 characters</small>
                </div>
            </div>
            <div class="login-details">
                <div class="checkbox-container">
                <input 
                id="rememberMe"
                type="checkbox" 
                class="checkbox"
                formControlName="rememberMe"  
                             />
             <label for="rememberMe">Remember me for 30 days</label>
                </div>
                <a [routerLink]="['/']">forgotten password</a>
            </div>
            <button type="submit" 
            class="login-button">
            Login
            </button>
        </form>
        <div class="divider">
            <div class="line"></div>
            <p class="or">or</p>
            <div class="line"></div>
        </div>
        <button class="social-login">
            <img src="/images/icons8-google 1.svg" alt="">
            <p>Signin with Google</p>
        </button>
        <div class="signup-link">
            <p class="signup">Don’t have an account? <a [routerLink]="['/signup']">Sign up</a></p>
        </div>
    </div>
    <img src="/images/chris-lee-70l1tDAI6rM-unsplash 1.svg" alt="">
</main>
